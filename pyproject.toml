[build-system]
requires = ["scikit-build-core>=0.9", "nanobind>=2.0", "numpy>=1.22"]
build-backend = "scikit_build_core.build"

[project]
name = "trexio"
version = "0.1.0"
description = "Python API of the TREXIO library (nanobind binding, SWIG-free)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "TREX-CoE" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX",
]
dependencies = ["numpy>=1.22"]

[project.urls]
Homepage = "https://github.com/TREX-CoE/trexio"

[tool.scikit-build]
minimum-version = "0.9"
build-dir = "build/{wheel_tag}"
wheel.packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
