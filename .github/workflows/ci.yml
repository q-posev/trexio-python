name: trexio-python

on: [push, pull_request]

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system deps (HDF5)
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libhdf5-dev hdf5-tools
          else
            brew install hdf5
          fi
      - name: Build installed TREXIO (upstream, text + memory + HDF5 back ends)
        run: |
          git clone --depth 1 https://github.com/TREX-CoE/trexio /tmp/trexio
          cd /tmp/trexio
          ./configure --prefix=$HOME/trexio-install
          make -j
          make install
      - name: Build + test
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install -U pip build
          export CMAKE_PREFIX_PATH="$HOME/trexio-install"
          python -m pip install . pytest
          export LD_LIBRARY_PATH="$HOME/trexio-install/lib:${LD_LIBRARY_PATH:-}"
          python -m pytest tests/ -q --all
      - name: Artifacts
        if: matrix.python == '3.12' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wheel-ubuntu
          path: dist/*.whl
